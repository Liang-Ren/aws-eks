apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-eks-deploy
  namespace: liang-eks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-eks
  template:
    metadata:
      labels:
        app: flask-eks
    spec:
      containers:
        - name: flask
          # Replace this with your ECR image, e.g.:
          # 123456789012.dkr.ecr.us-east-1.amazonaws.com/eks-lab-app:v1
          image: REPLACE_ECR_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-eks-svc
  namespace: liang-eks
spec:
  type: LoadBalancer
  selector:
    app: flask-eks
  ports:
    - port: 80
      targetPort: 5000
