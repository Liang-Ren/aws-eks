apiVersion: batch/v1
kind: CronJob
metadata:
  name: print-time
  namespace: ds-lab
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: timer
              image: busybox:1.36
              command: ["sh", "-c", "echo 'Cron run at: ' $(date); sleep 3"]