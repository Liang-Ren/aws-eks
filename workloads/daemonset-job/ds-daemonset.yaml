apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hostinfo-daemon
  namespace: ds-lab
spec:
  selector:
    matchLabels:
      app: hostinfo-daemon
  template:
    metadata:
      labels:
        app: hostinfo-daemon
    spec:
      containers:
        - name: hostinfo
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo 'FROM GIT:' $(date) $(hostname); sleep 10; done"]